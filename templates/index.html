<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI-17 Flight Analysis System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border-top-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .gradient-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <!-- NEW: Navigation Bar -->
    <nav class="bg-gradient-to-r from-purple-600 to-indigo-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-white text-xl font-bold hover:text-purple-200 transition">
                        🚁 MI-17 Flight Safety
                    </a>
                    <div class="hidden md:flex space-x-4">
                        <a href="/" class="text-white px-3 py-2 rounded-md text-sm font-medium bg-purple-700 hover:bg-purple-800 transition">
                            CVR Analysis
                        </a>
                        <a href="/dashboard" class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
                            Dashboard
                        </a>
                        <a href="/flights_list" class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
                            Flight List
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="/dashboard" class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-full text-sm font-semibold hover:bg-yellow-300 transition shadow-md hover:shadow-lg">
                        📊 View Dashboard
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div id="root"></div>
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const App = () => {
            const [selectedFiles, setSelectedFiles] = React.useState([]);
            const [excelFile, setExcelFile] = React.useState(null);
            const [outputFileName, setOutputFileName] = React.useState('');
            const [sheetName, setSheetName] = React.useState('STARTING WITH AC-GPU CHECKLIST');
            const [threshold, setThreshold] = React.useState(90);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [report, setReport] = React.useState(null);
            const [fileRemovedMessage, setFileRemovedMessage] = React.useState('');
            const [downloadExcelUrl, setDownloadExcelUrl] = React.useState(null);
            const [analyzingFlight, setAnalyzingFlight] = React.useState(false);

            const playSoundNotification = () => {
                try {
                    const context = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = context.createOscillator();
                    const gainNode = context.createGain();
                    oscillator.type = "square";
                    oscillator.frequency.setValueAtTime(880, context.currentTime);
                    oscillator.connect(gainNode);
                    gainNode.connect(context.destination);
                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.5);
                    oscillator.stop(context.currentTime + 0.5);
                } catch (e) {
                    console.warn("Could not play system beep:", e);
                }
            };

            const handleDragOver = (event) => {
                event.preventDefault();
                event.currentTarget.classList.add('border-indigo-500', 'bg-indigo-50');
            };

            const handleDragLeave = (event) => {
                event.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50');
            };

            const handleAudioDrop = (event) => {
                event.preventDefault();
                event.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50');
                const files = Array.from(event.dataTransfer.files);
                setSelectedFiles((prevFiles) => [...prevFiles, ...files]);
                setError(null);
            };

            const handleAudioFileChange = (event) => {
                const files = Array.from(event.target.files);
                setSelectedFiles((prevFiles) => [...prevFiles, ...files]);
                setError(null);
            };

            const handleExcelFileChange = (event) => {
                const file = event.target.files[0];
                if (file) {
                    if (!file.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                        setError('Please select a valid Excel file (.xlsx, .xls, or .xlsm).');
                        setExcelFile(null);
                        return;
                    }
                    setExcelFile(file);
                    setError(null);
                }
            };

            const removeFile = (fileName) => {
                setSelectedFiles((prevFiles) => prevFiles.filter(file => file.name !== fileName));
                setFileRemovedMessage(`"${fileName}" removed.`);
                setTimeout(() => setFileRemovedMessage(''), 3000);
            };

            const removeExcelFile = () => {
                if (excelFile) {
                    setFileRemovedMessage(`"${excelFile.name}" removed.`);
                    setExcelFile(null);
                    setTimeout(() => setFileRemovedMessage(''), 3000);
                }
            };

            const handleSubmit = async (event) => {
                event.preventDefault();
                if (selectedFiles.length === 0) {
                    setError('Please select at least one audio file.');
                    return;
                }
                if (!excelFile) {
                    setError('Please upload an Excel checklist file.');
                    return;
                }
                if (!excelFile.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                    setError('The uploaded file is not a valid Excel file type (.xlsx, .xls, or .xlsm).');
                    return;
                }
                if (!sheetName.trim()) {
                    setError('Please select an Excel sheet name.');
                    return;
                }
                if (!outputFileName.trim()) {
                    setError('Please enter a name for the resultant audio file.');
                    return;
                }
                setLoading(true);
                setError(null);
                setReport(null);
                setDownloadExcelUrl(null);
                const formData = new FormData();
                selectedFiles.forEach((file) => {
                    formData.append('audio_files[]', file);
                });
                formData.append('excel_file', excelFile);
                formData.append('output_file_name', outputFileName);
                formData.append('sheet_name', sheetName);
                formData.append('threshold', threshold);
                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        body: formData,
                    });
                    if (!response.ok) {
                        const errorText = await response.text();
                        try {
                            const errorJson = JSON.parse(errorText);
                            throw new Error(`Server error: ${response.status} - ${errorJson.error || 'Unknown error'}`);
                        } catch {
                            throw new Error(`Server error: ${response.status} - ${errorText}`);
                        }
                    }
                    const data = await response.json();
                    setReport(data);
                    playSoundNotification();
                    console.log('Report Data:', data);
                    if (data.download_excel_url) {
                        setDownloadExcelUrl(data.download_excel_url);
                    }
                } catch (err) {
                    console.error('Error during file upload or processing:', err);
                    setError(`Failed to process: ${err.message}. Please ensure all files are valid and the backend is running correctly.`);
                } finally {
                    setLoading(false);
                }
            };

            const handleAnalyzeFlightAnomalies = async () => {
                if (!report || !report.updated_excel_filename) {
                    setError('No compliance report available. Please generate a report first.');
                    return;
                }
                setAnalyzingFlight(true);
                setError(null);
                try {
                    const response = await fetch('/analyze_flight_anomalies', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            excel_filename: report.updated_excel_filename,
                            sheet_name: 'Clean Data'
                        }),
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to analyze flight anomalies');
                    }
                    const data = await response.json();
                    console.log('Analysis complete, redirecting to report page...');
                    window.location.href = '/anomaly_report';
                } catch (err) {
                    console.error('Error analyzing flight anomalies:', err);
                    setError(`Failed to analyze flight anomalies: ${err.message}`);
                    setAnalyzingFlight(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 p-4 font-inter text-gray-800 antialiased">
                    <div className="w-full max-w-7xl mx-auto">
                        {/* Header Section with Gradient Background */}
                        <div className="gradient-header text-white shadow-2xl rounded-2xl p-8 mb-8">
                            <div className="flex items-center justify-center mb-4">
                                <div className="text-6xl mr-4">🚁</div>
                                <div>
                                    <h1 className="text-4xl font-extrabold tracking-tight">AI-Powered Flight Analysis</h1>
                                    <p className="text-xl font-light mt-2 opacity-90">MI-17V-5 Checklist Compliance & Flight Data Anomaly Detection</p>
                                </div>
                            </div>
                        </div>

                        {/* Main Content Card */}
                        <div className="bg-white shadow-xl rounded-2xl p-8 space-y-8">
                            
                            {/* Two Column Upload Section */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                
                                {/* Excel File Upload Section */}
                                <div className="space-y-4">
                                    <h2 className="text-xl font-semibold text-indigo-700 mb-4 flex items-center">
                                        <span className="text-2xl mr-2">📄</span>
                                        Upload Checklist Excel File
                                    </h2>
                                    <div 
                                        className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center transition-all duration-200 ease-in-out hover:border-green-500 hover:bg-green-50"
                                        onDragOver={handleDragOver}
                                        onDragLeave={handleDragLeave}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            e.currentTarget.classList.remove('border-green-500', 'bg-green-50');
                                            const file = e.dataTransfer.files[0];
                                            if (file) {
                                                if (!file.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                                                    setError('Please drop a valid Excel file (.xlsx, .xls, or .xlsm).');
                                                    setExcelFile(null);
                                                } else {
                                                    setExcelFile(file);
                                                    setError(null);
                                                }
                                            }
                                        }}>
                                        <span className="mx-auto block text-4xl text-gray-400 mb-3">📊</span>
                                        <p className="text-base text-gray-600 font-semibold">Drag & drop Excel file</p>
                                        <label htmlFor="excelFile" className="cursor-pointer inline-flex items-center px-4 py-2 mt-3 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                                            Browse Excel File
                                        </label>
                                        <input type="file" id="excelFile" accept=".xlsx, .xls, .xlsm" onChange={handleExcelFileChange} className="sr-only"/>
                                    </div>
                                    {excelFile && (
                                        <div className="bg-green-50 p-4 rounded-lg shadow-inner border border-green-200 flex justify-between items-center">
                                            <span className="text-sm text-gray-800 truncate flex items-center">
                                                <span className="text-xl mr-2">✅</span>
                                                <strong className="font-medium">{excelFile.name}</strong>
                                            </span>
                                            <button type="button" onClick={removeExcelFile} className="ml-4 text-red-500 hover:text-red-700 transition-colors">❌</button>
                                        </div>
                                    )}
                                </div>

                                {/* Audio Files Upload Section */}
                                <div className="space-y-4">
                                    <h2 className="text-xl font-semibold text-indigo-700 mb-4 flex items-center">
                                        <span className="text-2xl mr-2">🎵</span>
                                        Upload Audio Files
                                    </h2>
                                    <div onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleAudioDrop} className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center transition-all duration-200 ease-in-out hover:border-indigo-500 hover:bg-indigo-50">
                                        <span className="mx-auto block text-4xl text-gray-400 mb-3">⬆️</span>
                                        <p className="text-base text-gray-600 font-semibold">Drag & drop audio files</p>
                                        <label htmlFor="audioFile" className="cursor-pointer inline-flex items-center px-4 py-2 mt-3 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                            Select Audio Files
                                        </label>
                                        <input type="file" id="audioFile" accept="audio/*" multiple onChange={handleAudioFileChange} className="sr-only"/>
                                    </div>
                                    {selectedFiles.length > 0 && (
                                        <div className="bg-indigo-50 p-4 rounded-lg shadow-inner border border-indigo-200 max-h-40 overflow-y-auto">
                                            <h3 className="text-sm font-semibold text-indigo-700 mb-2">Selected Files ({selectedFiles.length}):</h3>
                                            <ul className="space-y-1">
                                                {selectedFiles.map((file, index) => (
                                                    <li key={file.name + index} className="flex justify-between items-center text-xs text-gray-800 py-1 bg-white px-2 rounded">
                                                        <span className="truncate">{file.name}</span>
                                                        <button type="button" onClick={() => removeFile(file.name)} className="ml-2 text-red-500 hover:text-red-700 transition-colors">❌</button>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {fileRemovedMessage && (
                                <p className="text-sm text-green-600 text-center">{fileRemovedMessage}</p>
                            )}

                            {/* Form Section */}
                            <form onSubmit={handleSubmit} className="space-y-6 pt-6 border-t border-gray-200">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label htmlFor="outputFileName" className="block text-sm font-medium text-gray-700 mb-2">
                                            🎵 Output Audio File Name
                                        </label>
                                        <input type="text" id="outputFileName" value={outputFileName} onChange={(e) => setOutputFileName(e.target.value)} placeholder="e.g., combined_audio.wav" className="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"/>
                                    </div>
                                    <div>
                                        <label htmlFor="sheetName" className="block text-sm font-medium text-gray-700 mb-2">📄 Excel Sheet Name</label>
                                        <select id="sheetName" value={sheetName} onChange={(e) => setSheetName(e.target.value)} className="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white">
                                            <option value="STARTING WITH AC-GPU CHECKLIST">STARTING WITH AC-GPU CHECKLIST</option>
                                            <option value="STARTING WITH DC-GPU CHECKLIST">STARTING WITH DC-GPU CHECKLIST</option>
                                            <option value="STARTING WITHOUT GPU CHECKLIST">STARTING WITHOUT GPU CHECKLIST</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label htmlFor="threshold" className="block text-sm font-medium text-gray-700 mb-2">% Match Threshold (%)</label>
                                        <input type="number" id="threshold" value={threshold} onChange={(e) => setThreshold(Number(e.target.value))} min="0" max="100" className="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"/>
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className={`w-full py-3 px-6 border border-transparent rounded-xl shadow-lg text-lg font-semibold text-white transition duration-300 ease-in-out ${loading ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform hover:scale-[1.02]'}`}>
                                    {loading ? '⏳ Processing Audio...' : '✨ Generate Compliance Report'}
                                </button>
                            </form>

                            {error && (
                                <div className="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg relative">
                                    <strong className="font-bold mr-2">⚠️ Error!</strong>
                                    <span className="block sm:inline">{error}</span>
                                </div>
                            )}

                            {loading && (
                                <div className="flex items-center justify-center p-6 bg-blue-50 rounded-xl shadow-inner border border-blue-200">
                                    <div className="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mr-4"></div>
                                    <span className="text-xl text-blue-700 font-medium">Analyzing audio and generating report...</span>
                                </div>
                            )}

                            {/* Report Section */}
                            {report && (
                                <div className="space-y-6 mt-10">
                                    <h2 className="text-3xl font-bold text-center text-indigo-600 flex items-center justify-center">
                                        <span className="text-4xl mr-2">✅</span>
                                        Compliance Report
                                    </h2>
                                    
                                    {downloadExcelUrl && (
                                        <div className="flex justify-center mt-6">
                                            <a href={downloadExcelUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all" download>
                                                <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                                </svg>
                                                Download Updated Excel File
                                            </a>
                                        </div>
                                    )}
                                    
                                    <div className="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                                        <h3 className="text-2xl font-semibold text-gray-800 mb-4 text-center">Summary</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="bg-indigo-50 p-4 rounded-lg shadow-inner text-center">
                                                <p className="text-lg font-medium text-indigo-800">Overall Compliance:</p>
                                                <p className="text-indigo-700 text-3xl font-bold mt-1">{report.compliance_percent}%</p>
                                            </div>
                                            <div className="bg-red-50 p-4 rounded-lg shadow-inner text-center">
                                                <p className="text-lg font-medium text-red-800">Checks Not Complied:</p>
                                                <p className="text-red-700 text-3xl font-bold mt-1">{report.not_complied_count}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* UPDATED: Flight Data Anomaly Analysis Section */}
                                    <div className="bg-gradient-to-br from-purple-50 via-indigo-50 to-blue-50 p-6 rounded-xl shadow-lg border-2 border-indigo-300">
                                        <div className="flex items-center justify-center mb-4">
                                            <div className="bg-purple-600 rounded-full p-3 mr-3">
                                                <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                                </svg>
                                            </div>
                                            <h3 className="text-2xl font-bold text-indigo-800">
                                                Flight Data Anomaly Analysis
                                            </h3>
                                        </div>
                                        
                                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded">
                                            <div className="flex items-start">
                                                <div className="flex-shrink-0">
                                                    <svg className="h-5 w-5 text-blue-400 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                                                    </svg>
                                                </div>
                                                <div className="ml-3">
                                                    <h4 className="text-sm font-semibold text-blue-800 mb-1">What happens next?</h4>
                                                    <p className="text-sm text-blue-700">
                                                        Click below to analyze flight parameters for anomalies using AI. After viewing the results, 
                                                        you'll be able to:
                                                    </p>
                                                    <ul className="mt-2 text-sm text-blue-700 space-y-1">
                                                        <li className="flex items-center">
                                                            <svg className="w-4 h-4 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                                            </svg>
                                                            Review detailed anomaly detection results
                                                        </li>
                                                        <li className="flex items-center">
                                                            <svg className="w-4 h-4 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                                            </svg>
                                                            Decide whether to add flight to training data
                                                        </li>
                                                        <li className="flex items-center">
                                                            <svg className="w-4 h-4 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                                            </svg>
                                                            Choose to save results to database
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleAnalyzeFlightAnomalies} 
                                            disabled={analyzingFlight} 
                                            className={`w-full py-3 px-6 border border-transparent rounded-lg shadow-lg text-lg font-semibold text-white transition-all duration-300 ease-in-out flex items-center justify-center ${analyzingFlight ? 'bg-purple-400 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 transform hover:scale-[1.02] hover:shadow-xl'}`}
                                        >
                                            {analyzingFlight ? (
                                                <>
                                                    <div className="loader ease-linear rounded-full border-2 border-t-2 border-white h-5 w-5 mr-3"></div>
                                                    Analyzing Flight Data...
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                                    </svg>
                                                    Analyze Flight for Anomalies
                                                </>
                                            )}
                                        </button>
                                        
                                        <p className="text-xs text-center text-gray-500 mt-3 italic">
                                            Analysis will redirect to detailed report page
                                        </p>
                                    </div>

                                    <div className="bg-gray-50 p-6 rounded-lg shadow-md border border-gray-200">
                                        <h3 className="text-2xl font-semibold text-gray-800 mb-4">
                                            <span className="text-2xl mr-2">✅</span>
                                            Checklist Compliance Details
                                        </h3>
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-gray-200 rounded-lg overflow-hidden shadow-sm">
                                                <thead className="bg-indigo-100">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider rounded-tl-lg">Status</th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider">Checklist Item</th>
                                                        <th className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider rounded-tr-lg">Match Score (%)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    {report.results.map((item, index) => (
                                                        <tr key={item[1] + index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                                {item[0] === 'PASS' ? (
                                                                    <span className="text-green-600 flex items-center">
                                                                        <svg className="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                                                        </svg>
                                                                        PASS
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-red-600 flex items-center">
                                                                        <svg className="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                                                                        </svg>
                                                                        FAIL
                                                                    </span>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-4 whitespace-normal text-sm text-gray-900">{item[1]}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{item[2].toFixed(1)}%</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
                <App />
            </React.StrictMode>
        );
    </script>
</body>
</html>
