<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Compliance Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border-top-color: #4f46e5;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const App = () => {
            const [selectedFiles, setSelectedFiles] = React.useState([]);
            const [excelFile, setExcelFile] = React.useState(null);
            const [outputFileName, setOutputFileName] = React.useState('');
            const [sheetName, setSheetName] = React.useState('STARTING WITH AC-GPU CHECKLIST');
            const [threshold, setThreshold] = React.useState(90);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [report, setReport] = React.useState(null);
            const [fileRemovedMessage, setFileRemovedMessage] = React.useState('');
            const [addToTraining, setAddToTraining] = React.useState(false);
            const [analyzingFlight, setAnalyzingFlight] = React.useState(false);

            const playSoundNotification = () => {
                try {
                    const context = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = context.createOscillator();
                    const gainNode = context.createGain();

                    oscillator.type = "square";
                    oscillator.frequency.setValueAtTime(880, context.currentTime);
                    oscillator.connect(gainNode);
                    gainNode.connect(context.destination);

                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.5);
                    oscillator.stop(context.currentTime + 0.5);
                } catch (e) {
                    console.warn("Could not play system beep:", e);
                }
            };

            const handleDragOver = (event) => {
                event.preventDefault();
                event.currentTarget.classList.add('border-indigo-500', 'bg-indigo-50');
            };

            const handleDragLeave = (event) => {
                event.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50');
            };

            const handleAudioDrop = (event) => {
                event.preventDefault();
                event.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50');
                const files = Array.from(event.dataTransfer.files);
                setSelectedFiles((prevFiles) => [...prevFiles, ...files]);
                setError(null);
            };

            const handleAudioFileChange = (event) => {
                const files = Array.from(event.target.files);
                setSelectedFiles((prevFiles) => [...prevFiles, ...files]);
                setError(null);
            };

            const handleExcelFileChange = (event) => {
                const file = event.target.files[0];
                if (file) {
                    if (!file.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                        setError('Please select a valid Excel file (.xlsx, .xls, or .xlsm).');
                        setExcelFile(null);
                        return;
                    }
                    setExcelFile(file);
                    setError(null);
                }
            };

            const removeFile = (fileName) => {
                setSelectedFiles((prevFiles) => prevFiles.filter(file => file.name !== fileName));
                setFileRemovedMessage(`"${fileName}" removed.`);
                setTimeout(() => setFileRemovedMessage(''), 3000);
            };

            const removeExcelFile = () => {
                if (excelFile) {
                    setFileRemovedMessage(`"${excelFile.name}" removed.`);
                    setExcelFile(null);
                    setTimeout(() => setFileRemovedMessage(''), 3000);
                }
            };

            const handleSubmit = async (event) => {
                event.preventDefault();

                if (selectedFiles.length === 0) {
                    setError('Please select at least one audio file.');
                    return;
                }

                if (!excelFile) {
                    setError('Please upload an Excel checklist file.');
                    return;
                }

                if (!excelFile.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                    setError('The uploaded file is not a valid Excel file type (.xlsx, .xls, or .xlsm).');
                    return;
                }

                if (!sheetName.trim()) {
                    setError('Please select an Excel sheet name.');
                    return;
                }

                if (!outputFileName.trim()) {
                    setError('Please enter a name for the resultant audio file.');
                    return;
                }

                setLoading(true);
                setError(null);
                setReport(null);

                const formData = new FormData();
                selectedFiles.forEach((file) => {
                    formData.append('audio_files[]', file);
                });
                formData.append('excel_file', excelFile);
                formData.append('output_file_name', outputFileName);
                formData.append('sheet_name', sheetName);
                formData.append('threshold', threshold);

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        try {
                            const errorJson = JSON.parse(errorText);
                            throw new Error(`Server error: ${response.status} - ${errorJson.error || 'Unknown error'}`);
                        } catch {
                            throw new Error(`Server error: ${response.status} - ${errorText}`);
                        }
                    }

                    const data = await response.json();
                    setReport(data);
                    playSoundNotification();
                    console.log('Report Data:', data);

                } catch (err) {
                    console.error('Error during file upload or processing:', err);
                    setError(`Failed to process: ${err.message}. Please ensure all files are valid and the backend is running correctly.`);
                } finally {
                    setLoading(false);
                }
            };

            const handleAnalyzeFlightAnomalies = async () => {
                if (!report || !report.updated_excel_filename) {
                    setError('No compliance report available. Please generate a report first.');
                    return;
                }

                setAnalyzingFlight(true);
                setError(null);

                try {
                    const response = await fetch('/analyze_flight_anomalies', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            excel_filename: report.updated_excel_filename,
                            add_to_training: addToTraining,
                            sheet_name: 'Clean Data'
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to analyze flight anomalies');
                    }

                    const data = await response.json();
                    console.log('Analysis complete, redirecting to report page...');
                    
                    // Redirect to the anomaly report page directly
                    // The backend will handle storing the data and rendering the page
                    window.location.href = '/anomaly_report';

                } catch (err) {
                    console.error('Error analyzing flight anomalies:', err);
                    setError(`Failed to analyze flight anomalies: ${err.message}`);
                    setAnalyzingFlight(false);
                }
            };

            const downloadHTMLReport = (htmlContent, filename) => {
                // Create a Blob from the HTML content
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                // Create a temporary link and trigger download
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                console.log(`Report downloaded as ${filename}`);
            };

            const generateAnomalyReportHTML = (results) => {
                // Generate HTML for the anomaly report in a new window
                return `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Flight Anomaly Analysis - Flight ${results.flight_id}</title>
                        <script src="https://cdn.tailwindcss.com"><\/script>
                        <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"><\/script>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
                        <style>
                            body { font-family: 'Inter', sans-serif; }
                        </style>
                    </head>
                    <body class="bg-gradient-to-br from-blue-100 to-purple-100 p-4">
                        <div class="max-w-7xl mx-auto">
                            <div class="bg-white shadow-xl rounded-2xl p-8 mb-6">
                                <h1 class="text-4xl font-extrabold text-center text-indigo-700 mb-8">
                                    Flight Anomaly Analysis Report
                                </h1>
                                
                                <!-- Summary Cards -->
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                                    <div class="bg-blue-50 p-6 rounded-lg shadow-md border border-blue-200">
                                        <p class="text-sm font-medium text-blue-800 mb-2">Flight ID</p>
                                        <p class="text-3xl font-bold text-blue-900">${results.flight_id}</p>
                                    </div>
                                    <div class="bg-green-50 p-6 rounded-lg shadow-md border border-green-200">
                                        <p class="text-sm font-medium text-green-800 mb-2">Total Data Points</p>
                                        <p class="text-3xl font-bold text-green-900">${results.total_data_points}</p>
                                    </div>
                                    <div class="bg-red-50 p-6 rounded-lg shadow-md border border-red-200">
                                        <p class="text-sm font-medium text-red-800 mb-2">Anomalies Detected</p>
                                        <p class="text-3xl font-bold text-red-900">${results.anomaly_count}</p>
                                    </div>
                                    <div class="bg-purple-50 p-6 rounded-lg shadow-md border border-purple-200">
                                        <p class="text-sm font-medium text-purple-800 mb-2">Anomaly Rate</p>
                                        <p class="text-3xl font-bold text-purple-900">${results.anomaly_percentage}%</p>
                                    </div>
                                </div>

                                <!-- Training Status -->
                                <div class="mb-8 p-4 rounded-lg ${results.added_to_training ? 'bg-green-50 border border-green-300' : 'bg-gray-50 border border-gray-300'}">
                                    <p class="text-center font-semibold">
                                        ${results.added_to_training 
                                            ? '✅ This flight has been added to the training database' 
                                            : '📊 Analysis only - not added to training database'}
                                    </p>
                                    <p class="text-center text-sm text-gray-600 mt-2">
                                        Total historical flights in database: ${results.total_historical_flights}
                                    </p>
                                </div>

                                <!-- Phase Summary -->
                                <div class="bg-gray-50 p-6 rounded-lg shadow-md mb-8">
                                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Phase Summary</h2>
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        ${Object.entries(results.phases_summary).map(([phase, data]) => `
                                            <div class="bg-white p-4 rounded-lg shadow border border-gray-200">
                                                <h3 class="font-semibold text-lg text-indigo-700 mb-2 capitalize">${phase}</h3>
                                                <p class="text-sm text-gray-600">Data Points: <span class="font-bold">${data.total_points}</span></p>
                                                <p class="text-sm text-gray-600">Anomalies: <span class="font-bold text-red-600">${data.anomaly_count}</span></p>
                                                <p class="text-sm text-gray-600">Rate: <span class="font-bold">${data.anomaly_percentage}%</span></p>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- Anomaly Details -->
                                ${results.anomaly_count > 0 ? `
                                    <div class="bg-red-50 p-6 rounded-lg shadow-md mb-8">
                                        <h2 class="text-2xl font-bold text-red-800 mb-4">Detected Anomalies</h2>
                                        <div class="overflow-x-auto">
                                            <table class="min-w-full divide-y divide-gray-200 rounded-lg overflow-hidden shadow-sm">
                                                <thead class="bg-red-100">
                                                    <tr>
                                                        <th class="px-6 py-3 text-left text-xs font-medium text-red-800 uppercase">Parameter</th>
                                                        <th class="px-6 py-3 text-left text-xs font-medium text-red-800 uppercase">Phase</th>
                                                        <th class="px-6 py-3 text-left text-xs font-medium text-red-800 uppercase">Time</th>
                                                        <th class="px-6 py-3 text-left text-xs font-medium text-red-800 uppercase">Value</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="bg-white divide-y divide-gray-200">
                                                    ${results.anomalies.map((anomaly, idx) => `
                                                        <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${anomaly.parameter}</td>
                                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 capitalize">${anomaly.phase}</td>
                                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${anomaly.time.toFixed(2)}</td>
                                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${anomaly.value.toFixed(2)}</td>
                                                        </tr>
                                                    `).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="bg-green-50 p-6 rounded-lg shadow-md mb-8 text-center">
                                        <p class="text-2xl font-bold text-green-800">✅ No anomalies detected</p>
                                        <p class="text-gray-600 mt-2">All parameters are within expected ranges based on historical data</p>
                                    </div>
                                `}

                                <!-- Charts Section -->
                                <div class="mt-8">
                                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Parameter Visualizations</h2>
                                    <div id="charts-container"></div>
                                </div>
                            </div>
                        </div>

                        <script>
                            const vizData = ${JSON.stringify(results.visualization_data)};
                            const chartsContainer = document.getElementById('charts-container');
                            
                            // Generate charts for each parameter and phase
                            Object.keys(vizData).forEach(param => {
                                if (param === 'historical') return; // Skip historical key
                                
                                const paramData = vizData[param];
                                const phases = ['before takeoff', 'when airborne', 'after landing'];
                                
                                phases.forEach(phase => {
                                    const phaseData = paramData[phase];
                                    if (!phaseData || !phaseData.has_data) return;
                                    
                                    const chartDiv = document.createElement('div');
                                    chartDiv.className = 'mb-6 bg-white p-4 rounded-lg shadow-md';
                                    chartDiv.id = param + '-' + phase.replace(/\\s+/g, '-');
                                    chartsContainer.appendChild(chartDiv);
                                    
                                    const traces = [];
                                    
                                    // Add historical data if available
                                    if (vizData.historical && vizData.historical[param] && vizData.historical[param][phase]) {
                                        traces.push({
                                            x: vizData.historical[param][phase].time,
                                            y: vizData.historical[param][phase].values,
                                            mode: 'markers',
                                            type: 'scatter',
                                            name: 'Historical Data',
                                            marker: { color: 'darkgrey', size: 4, opacity: 0.5 }
                                        });
                                    }
                                    
                                    // Add normal points
                                    if (phaseData.normal && phaseData.normal.time.length > 0) {
                                        traces.push({
                                            x: phaseData.normal.time,
                                            y: phaseData.normal.values,
                                            mode: 'markers',
                                            type: 'scatter',
                                            name: 'Current Flight',
                                            marker: { color: 'blue', size: 6 }
                                        });
                                    }
                                    
                                    // Add anomalies
                                    if (phaseData.anomalies && phaseData.anomalies.time.length > 0) {
                                        traces.push({
                                            x: phaseData.anomalies.time,
                                            y: phaseData.anomalies.values,
                                            mode: 'markers',
                                            type: 'scatter',
                                            name: 'Anomalies',
                                            marker: { color: 'red', size: 10, symbol: 'x' }
                                        });
                                    }
                                    
                                    const layout = {
                                        title: param + ' - ' + phase.charAt(0).toUpperCase() + phase.slice(1),
                                        xaxis: { title: 'Time' },
                                        yaxis: { title: param },
                                        showlegend: true,
                                        height: 400
                                    };
                                    
                                    Plotly.newPlot(chartDiv.id, traces, layout);
                                });
                            });
                        <\/script>
                    </body>
                    </html>
                `;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 p-4 font-inter text-gray-800 antialiased flex flex-col items-center">
                    <div className="w-full max-w-4xl bg-white shadow-xl rounded-2xl p-8 space-y-8 mt-8">
                        <h1 className="text-4xl font-extrabold text-center text-indigo-700 mb-8 tracking-tight">
                            Audio Compliance Checker
                        </h1>

                        {/* Excel File Upload Section */}
                        <div className="space-y-4">
                            <h2 className="text-2xl font-semibold text-indigo-600 mb-4">Upload Checklist Excel File</h2>
                            <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center transition-all duration-200 ease-in-out hover:border-green-500 hover:bg-green-50"
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={(e) => {
                                    e.preventDefault();
                                    e.currentTarget.classList.remove('border-green-500', 'bg-green-50');
                                    const file = e.dataTransfer.files[0];
                                    if (file) {
                                        if (!file.name.match(/\.(xlsx|xls|xlsm)$/i)) {
                                            setError('Please drop a valid Excel file (.xlsx, .xls, or .xlsm).');
                                            setExcelFile(null);
                                        } else {
                                            setExcelFile(file);
                                            setError(null);
                                        }
                                    }
                                }}
                                aria-live="polite" aria-atomic="true">
                                <span className="mx-auto block text-5xl text-gray-400 mb-3" role="img" aria-label="Excel file icon">📄</span>
                                <p className="text-lg text-gray-600 font-semibold">Drag & drop your Excel file here, or</p>
                                <label htmlFor="excelFile" className="cursor-pointer inline-flex items-center px-4 py-2 mt-3 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                                    Browse Excel File
                                </label>
                                <input
                                    type="file"
                                    id="excelFile"
                                    accept=".xlsx, .xls, .xlsm"
                                    onChange={handleExcelFileChange}
                                    className="sr-only"
                                    aria-describedby="excel-upload-description"
                                />
                                <p id="excel-upload-description" className="sr-only">Upload your Excel checklist file.</p>
                            </div>
                            {excelFile && (
                                <div className="bg-gray-50 p-4 rounded-lg shadow-inner border border-gray-200 flex justify-between items-center">
                                    <span className="text-sm text-gray-800 truncate" aria-label={`Excel file selected: ${excelFile.name}`}>
                                        Selected Excel File: <strong className="font-medium">{excelFile.name}</strong>
                                    </span>
                                    <button
                                        type="button"
                                        onClick={removeExcelFile}
                                        className="ml-4 text-red-500 hover:text-red-700 transition-colors duration-150 ease-in-out focus:outline-none"
                                        title={`Remove ${excelFile.name}`}
                                        aria-label={`Remove Excel file ${excelFile.name}`}
                                    >
                                        ❌
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Audio Files Upload Section */}
                        <h2 className="text-2xl font-semibold text-indigo-600 mb-4 mt-8">Upload Audio Files</h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleAudioDrop}
                                className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center transition-all duration-200 ease-in-out hover:border-indigo-500 hover:bg-indigo-50"
                                aria-live="polite"
                                aria-atomic="true"
                            >
                                <span className="mx-auto block text-5xl text-gray-400 mb-3" role="img" aria-label="Upload icon">⬆️</span>
                                <p className="text-lg text-gray-600 font-semibold">Drag & drop your audio files here, or</p>
                                <label htmlFor="audioFile" className="cursor-pointer inline-flex items-center px-4 py-2 mt-3 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                    Select Audio Files
                                </label>
                                <input
                                    type="file"
                                    id="audioFile"
                                    accept="audio/*"
                                    multiple
                                    onChange={handleAudioFileChange}
                                    className="sr-only"
                                    aria-describedby="audio-upload-description"
                                />
                                <p id="audio-upload-description" className="sr-only">Upload audio files for compliance checking.</p>
                            </div>

                            {/* Display Selected Audio Files */}
                            {selectedFiles.length > 0 && (
                                <div className="bg-gray-50 p-4 rounded-lg shadow-inner border border-gray-200">
                                    <h3 className="text-lg font-medium text-gray-700 mb-2">Selected Audio Files:</h3>
                                    <ul className="list-disc pl-5 space-y-1">
                                        {selectedFiles.map((file, index) => (
                                            <li key={file.name + index} className="flex justify-between items-center text-sm text-gray-800 py-1">
                                                <span className="truncate" aria-label={`Audio file selected: ${file.name}`}>{file.name}</span>
                                                <button
                                                    type="button"
                                                    onClick={() => removeFile(file.name)}
                                                    className="ml-4 text-red-500 hover:text-red-700 transition-colors duration-150 ease-in-out focus:outline-none"
                                                    title={`Remove ${file.name}`}
                                                    aria-label={`Remove audio file ${file.name}`}
                                                >
                                                    ❌
                                                </button>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                            {fileRemovedMessage && (
                                <p className="mt-2 text-sm text-green-600" aria-live="assertive">
                                    {fileRemovedMessage}
                                </p>
                            )}

                            <div className="flex flex-col sm:flex-row sm:items-end sm:space-x-6 space-y-6 sm:space-y-0">
                                {/* Resultant Audio File Name Input */}
                                <div className="flex-1">
                                    <label htmlFor="outputFileName" className="block text-sm font-medium text-gray-700 mb-2">
                                        <span role="img" aria-label="Musical note icon">🎵</span> Resultant Audio File Name
                                    </label>
                                    <input
                                        type="text"
                                        id="outputFileName"
                                        value={outputFileName}
                                        onChange={(e) => setOutputFileName(e.target.value)}
                                        placeholder="e.g., combined_audio.wav"
                                        className="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out"
                                        aria-required="true"
                                    />
                                </div>

                                {/* Excel Sheet Name Dropdown */}
                                <div>
                                    <label htmlFor="sheetName" className="block text-sm font-medium text-gray-700 mb-2">
                                        <span role="img" aria-label="Page icon">📄</span> Excel Sheet Name
                                    </label>
                                    <select
                                        id="sheetName"
                                        value={sheetName}
                                        onChange={(e) => setSheetName(e.target.value)}
                                        className="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out bg-white"
                                        aria-required="true"
                                    >
                                        <option value="STARTING WITH AC-GPU CHECKLIST">STARTING WITH AC-GPU CHECKLIST</option>
                                        <option value="STARTING WITH DC-GPU CHECKLIST">STARTING WITH DC-GPU CHECKLIST</option>
                                        <option value="STARTING WITHOUT GPU CHECKLIST">STARTING WITHOUT GPU CHECKLIST</option>
                                    </select>
                                </div>

                                {/* Threshold Input */}
                                <div>
                                    <label htmlFor="threshold" className="block text-sm font-medium text-gray-700 mb-2">
                                        <span role="img" aria-label="Percent sign icon">%</span> Match Threshold (%)
                                    </label>
                                    <input
                                        type="number"
                                        id="threshold"
                                        value={threshold}
                                        onChange={(e) => setThreshold(Number(e.target.value))}
                                        min="0"
                                        max="100"
                                        className="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                        aria-valuenow={threshold}
                                    />
                                </div>
                            </div>

                            {/* Submit Button */}
                            <button
                                type="submit"
                                disabled={loading}
                                className={`w-full py-3 px-6 border border-transparent rounded-lg shadow-sm text-lg font-semibold text-white transition duration-300 ease-in-out ${
                                    loading
                                        ? 'bg-indigo-400 cursor-not-allowed'
                                        : 'bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500'
                                }`}
                                aria-live="polite"
                                aria-busy={loading ? "true" : "false"}
                            >
                                {loading ? 'Processing Audio...' : 'Generate Compliance Report'}
                            </button>
                        </form>

                        {/* Error Message Display */}
                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative" role="alert">
                                <strong className="font-bold mr-2">Error!</strong>
                                <span className="block sm:inline">{error}</span>
                            </div>
                        )}

                        {/* Loading Indicator */}
                        {loading && (
                            <div className="flex items-center justify-center p-6 bg-blue-50 rounded-lg shadow-inner" role="status" aria-label="Loading">
                                <div className="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mr-4"></div>
                                <span className="text-xl text-blue-700 font-medium">Analyzing audio and generating report...</span>
                            </div>
                        )}

                        {/* Report Display Section */}
                        {report && (
                            <div className="space-y-6 mt-10">
                                <h2 className="text-3xl font-bold text-center text-indigo-600 flex items-center justify-center">
                                    <span role="img" aria-label="Information icon">ℹ️</span> Compliance Report
                                </h2>

                                {/* Overall Compliance Summary */}
                                <div className="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                                    <h3 className="text-2xl font-semibold text-gray-800 mb-4 text-center">Summary</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-indigo-50 p-4 rounded-lg shadow-inner text-center">
                                            <p className="text-lg font-medium text-indigo-800">
                                                Overall Compliance:
                                            </p>
                                            <p className="text-indigo-700 text-3xl font-bold mt-1">
                                                {report.compliance_percent}%
                                            </p>
                                        </div>
                                        <div className="bg-red-50 p-4 rounded-lg shadow-inner text-center">
                                            <p className="text-lg font-medium text-red-800">
                                                Checks Not Complied:
                                            </p>
                                            <p className="text-red-700 text-3xl font-bold mt-1">
                                                {report.not_complied_count}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Flight Anomaly Analysis Section */}
                                <div className="bg-gradient-to-r from-purple-50 to-indigo-50 p-6 rounded-lg shadow-md border-2 border-indigo-200">
                                    <h3 className="text-2xl font-semibold text-indigo-800 mb-4 text-center">
                                        <span role="img" aria-label="Chart icon">📊</span> Flight Data Anomaly Analysis
                                    </h3>
                                    
                                    <div className="flex items-center justify-center mb-4">
                                        <label className="flex items-center cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={addToTraining}
                                                onChange={(e) => setAddToTraining(e.target.checked)}
                                                className="w-5 h-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 focus:ring-2"
                                            />
                                            <span className="ml-3 text-sm font-medium text-gray-700">
                                                Add this flight data to training database
                                            </span>
                                        </label>
                                    </div>

                                    <button
                                        onClick={handleAnalyzeFlightAnomalies}
                                        disabled={analyzingFlight}
                                        className={`w-full py-3 px-6 border border-transparent rounded-lg shadow-sm text-lg font-semibold text-white transition duration-300 ease-in-out ${
                                            analyzingFlight
                                                ? 'bg-purple-400 cursor-not-allowed'
                                                : 'bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500'
                                        }`}
                                    >
                                        {analyzingFlight ? 'Analyzing Flight Data...' : 'Analyze Flight for Anomalies'}
                                    </button>

                                    <p className="text-xs text-gray-600 text-center mt-3">
                                        {addToTraining 
                                            ? '✓ Flight will be analyzed and added to historical data for future comparisons' 
                                            : 'ℹ Flight will only be analyzed, not added to training database'}
                                    </p>
                                </div>

                                {/* Compliance Results Table */}
                                <div className="bg-gray-50 p-6 rounded-lg shadow-md border border-gray-200">
                                    <h3 className="text-2xl font-semibold text-gray-800 mb-4">
                                        <span role="img" aria-label="Checkmark icon">✅</span> Checklist Compliance
                                    </h3>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full divide-y divide-gray-200 rounded-lg overflow-hidden shadow-sm" role="table">
                                            <thead className="bg-indigo-100">
                                                <tr>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider rounded-tl-lg">
                                                        Status
                                                    </th>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider">
                                                        Checklist Item
                                                    </th>
                                                    <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-indigo-800 uppercase tracking-wider rounded-tr-lg">
                                                        Match Score (%)
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {report.results.map((item, index) => (
                                                    <tr key={item[1] + index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                            {item[0] === 'PASS' ? (
                                                                <span className="text-green-600 flex items-center" role="status">
                                                                    <span role="img" aria-label="Green checkmark">✅</span> PASS
                                                                </span>
                                                            ) : (
                                                                <span className="text-red-600 flex items-center" role="status">
                                                                    <span role="img" aria-label="Red X">❌</span> FAIL
                                                                </span>
                                                            )}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-normal text-sm text-gray-900">
                                                            {item[1]}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                                            {item[2].toFixed(1)}%
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
                <App />
            </React.StrictMode>
        );
    </script>
</body>
</html>
